<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Calculator & Unit Converter</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121726;
      --border: #1e293b;
      --accent: #c084fc;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top {
      height: 48px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .left-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-chip:active { transform: scale(0.96); }

    .tabs {
      display: flex;
      gap: 6px;
      background: #090d16;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 900;
    }

    /* Main Container */
    .main-stage {
      flex: 1;
      height: 432px;
      padding: 12px 16px;
      display: flex;
      gap: 14px;
    }

    /* Left Panel: Calculator */
    .calc-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .disp {
      height: 68px;
      background: #101217;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 18px;
      font: 700 38px monospace;
      color: #f1f5f9;
      letter-spacing: .04em;
    }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { background: #334155; }
    .btn.op {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.op:active { background: var(--accent); color: #000; }

    /* Right Panel: Auto Converter */
    .converter-panel {
      width: 290px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .converter-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .conv-item {
      background: #0b0f19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .conv-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
    }
    .conv-val {
      font-size: 15px;
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
    }
    .conv-sub {
      font-size: 11px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="left-nav">
      <button class="btn-chip" id="home" type="button">← Tools</button>
      <span style="font-weight:800; font-size:15px;">Calculator & Automotive Converter</span>
    </div>
  </div>

  <div class="main-stage">

    <!-- Standard Calculator Grid -->
    <div class="calc-panel">
      <div class="disp" id="disp">0</div>
      <div class="grid" id="grid"></div>
    </div>

    <!-- Live Auto Conversion Panel (Converts current displayed number!) -->
    <div class="converter-panel">
      <div class="converter-title">🚗 Live Car Unit Converter</div>
      
      <div class="conv-item">
        <div class="conv-label">Speed (km/h ⇄ mph)</div>
        <div class="conv-val" id="conv-speed">0 mph / 0 km/h</div>
      </div>

      <div class="conv-item">
        <div class="conv-label">Tire Pressure (PSI ⇄ Bar)</div>
        <div class="conv-val" id="conv-tire">0 bar / 0 PSI</div>
      </div>

      <div class="conv-item">
        <div class="conv-label">Temperature (°C ⇄ °F)</div>
        <div class="conv-val" id="conv-temp">0 °F / 0 °C</div>
      </div>

      <div class="conv-item">
        <div class="conv-label">Fuel (US MPG ⇄ L/100km)</div>
        <div class="conv-val" id="conv-fuel">0 L/100km</div>
      </div>
    </div>

  </div>

  <script>
    var HOME = "../index.html#tools";
    document.getElementById("home").onclick = function () { location.href = HOME; };

    var disp = document.getElementById("disp");
    var cur = "0", acc = null, op = null, fresh = false;
    var keys = ["C","±","%","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","⌫","="];

    function n() { return parseFloat(cur) || 0; }

    function updateConversions() {
      var val = n();
      // Speed
      var mph = (val * 0.621371).toFixed(1);
      var kmh = (val / 0.621371).toFixed(1);
      document.getElementById("conv-speed").textContent = val + " km/h = " + mph + " mph";

      // Tire Pressure
      var bar = (val * 0.0689476).toFixed(2);
      var psi = (val / 0.0689476).toFixed(1);
      document.getElementById("conv-tire").textContent = val + " PSI = " + bar + " bar";

      // Temperature
      var degF = (val * 9/5 + 32).toFixed(1);
      var degC = ((val - 32) * 5/9).toFixed(1);
      document.getElementById("conv-temp").textContent = val + "°C = " + degF + "°F";

      // Fuel economy (235.215 / mpg)
      var l100 = val > 0 ? (235.215 / val).toFixed(1) : "0";
      document.getElementById("conv-fuel").textContent = val + " MPG = " + l100 + " L/100km";
    }

    function show() {
      disp.textContent = cur.length > 12 ? Number(cur).toExponential(6) : cur;
      updateConversions();
    }

    function apply() {
      var x = n();
      if (acc == null || !op) { acc = x; return; }
      if (op === "+") acc += x;
      if (op === "-") acc -= x;
      if (op === "*") acc *= x;
      if (op === "/") acc = x ? acc / x : acc;
      cur = String(acc);
    }

    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "btn" + ("/*-+=".indexOf(k) >= 0 ? " op" : "");
      b.textContent = k;
      b.onclick = function () {
        if (k >= "0" && k <= "9") {
          cur = (fresh || cur === "0") ? k : cur + k; fresh = false;
        } else if (k === ".") {
          if (fresh) { cur = "0."; fresh = false; }
          else if (cur.indexOf(".") < 0) cur += ".";
        } else if (k === "C") { cur = "0"; acc = null; op = null; }
        else if (k === "±") { cur = String(-n()); }
        else if (k === "%") { cur = String(n() / 100); }
        else if (k === "⌫") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; }
        else if (k === "=") { apply(); op = null; fresh = true; }
        else { apply(); op = k; fresh = true; }
        show();
      };
      document.getElementById("grid").appendChild(b);
    });

    updateConversions();
  </script>
</body>
</html>
