<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0, user-scalable=no">
  <title>Game Boy Player</title>
  <style>
    :root {
      --bg: #090d16;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --btn-b: #f43f5e;
      --dpad-bg: #1e293b;
      --dpad-border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      width: 800px;
      height: 480px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      height: 40px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
    }
    .back-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .back-btn:active { background: #334155; }

    .title-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-badge {
      background: #1e293b;
      border: 1px solid #8b5cf6;
      color: #c4b5fd;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fps-badge {
      font-size: 11px;
      font-weight: 800;
      color: #34d399;
      background: #064e3b;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }
    .action-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .action-pill:active { background: var(--accent); }

    /* Console Body */
    .console-body {
      flex: 1;
      height: 440px;
      display: flex;
      position: relative;
    }

    /* Left Control Wing: D-Pad & SELECT */
    .left-wing {
      width: 190px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 14px 0 20px;
      z-index: 20;
    }

    /* Large Tactile D-PAD */
    .dpad-container {
      width: 144px;
      height: 144px;
      position: relative;
    }
    .dpad-center {
      position: absolute;
      left: 48px;
      top: 48px;
      width: 48px;
      height: 48px;
      background: var(--dpad-bg);
      border: 2px solid var(--dpad-border);
      border-radius: 4px;
    }
    .dpad-btn {
      position: absolute;
      background: var(--dpad-bg);
      border: 2px solid var(--dpad-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #cbd5e1;
      cursor: pointer;
    }
    .dpad-btn.active {
      background: var(--accent) !important;
      color: white !important;
    }
    .dpad-up {
      left: 48px;
      top: 0;
      width: 48px;
      height: 52px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom: none;
    }
    .dpad-down {
      left: 48px;
      bottom: 0;
      width: 48px;
      height: 52px;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      border-top: none;
    }
    .dpad-left {
      left: 0;
      top: 48px;
      width: 52px;
      height: 48px;
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      border-right: none;
    }
    .dpad-right {
      right: 0;
      top: 48px;
      width: 52px;
      height: 48px;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      border-left: none;
    }

    .meta-pill-left {
      width: 110px;
      height: 40px;
      background: #1e293b;
      border: 2px solid #334155;
      color: #cbd5e1;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .meta-pill-left.active {
      background: var(--accent) !important;
      color: white !important;
    }

    /* Center Screen Pillar (Authentic GB 160x144 Native Scaled to 400x360) */
    .center-pillar {
      width: 420px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .screen-bezel {
      width: 404px;
      height: 364px;
      background: #000;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #screen {
      width: 400px !important;
      height: 360px !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      display: block;
      background: #000;
      margin: 0;
      padding: 0;
    }

    /* Bottom ROM Picker */
    .rom-carousel {
      margin-top: 8px;
      width: 420px;
      height: 38px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .rom-pill {
      background: #131d2e;
      border: 1px solid #2d3b55;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .rom-pill.active {
      background: #7c3aed;
      border-color: #a78bfa;
      color: white;
    }
    .rom-pill:active {
      transform: scale(0.96);
    }

    /* Right Control Wing: Dedicated B Button, Knob A Hint, START */
    .right-wing {
      width: 190px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 14px 0 20px;
      z-index: 20;
    }
    .round-btn-b-large {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      color: white;
      background: var(--btn-b);
      border: 4px solid #be123c;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
      cursor: pointer;
    }
    .round-btn-b-large.active {
      background: #9f1239 !important;
      transform: translateY(2px);
    }

    .knob-hint-badge {
      font-size: 12px;
      font-weight: 800;
      color: #34d399;
      background: #064e3b;
      border: 1px solid #059669;
      padding: 5px 12px;
      border-radius: 14px;
      text-align: center;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: all 0.15s;
    }
    .knob-hint-badge.active {
      background: #10b981;
      color: #000;
      transform: scale(1.08);
    }

    .meta-pill-right {
      width: 110px;
      height: 40px;
      background: #1e293b;
      border: 2px solid #334155;
      color: #cbd5e1;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .meta-pill-right.active {
      background: var(--accent) !important;
      color: white !important;
    }

    /* OSD Messages */
    .osd {
      position: absolute;
      top: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #8b5cf6;
      color: #c4b5fd;
      padding: 6px 18px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 60;
    }
    .osd.visible { opacity: 1; }
  </style>
</head>
<body>

  <!-- Top Status Bar -->
  <div class="top-bar">
    <button class="back-btn" id="btn-back" type="button">← Tools</button>
    <div class="title-area">
      <span class="game-badge" id="lbl-title">Loading...</span>
      <span class="fps-badge" id="lbl-fps">GB 60 FPS</span>
    </div>
    <div class="top-actions">
      <button class="action-pill" id="btn-save" type="button">💾 Save</button>
      <button class="action-pill" id="btn-reset" type="button">🔄 Reset</button>
      <button class="action-pill" id="btn-open-file" type="button">📂 ROM</button>
      <input type="file" id="file-input" accept=".gb,.gbc" style="display:none">
    </div>
  </div>

  <!-- Console Main Viewport -->
  <div class="console-body">
    <div class="osd" id="osd-msg">Loaded!</div>

    <!-- Left Controls: D-Pad, SELECT -->
    <div class="left-wing">
      <div class="dpad-container" id="dpad">
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-up" id="btn-up" type="button">▲</button>
        <button class="dpad-btn dpad-down" id="btn-down" type="button">▼</button>
        <button class="dpad-btn dpad-left" id="btn-left" type="button">◀</button>
        <button class="dpad-btn dpad-right" id="btn-right" type="button">▶</button>
      </div>
      <button class="meta-pill-left" id="btn-select" type="button">SELECT</button>
    </div>

    <!-- Center Display & Game Selector -->
    <div class="center-pillar">
      <div class="screen-bezel">
        <canvas id="screen" width="160" height="144"></canvas>
      </div>
      <div class="rom-carousel">
        <button class="rom-pill active" id="pill-homebrew" type="button">🎮 2048 GB</button>
        <button class="rom-pill" id="pill-advancetris" type="button">🧱 Advancetris</button>
        <button class="rom-pill" id="pill-anguna" type="button">🗡️ Anguna</button>
        <button class="rom-pill" id="pill-custom" type="button">📂 Load ROM...</button>
      </div>

    </div>

    <!-- Right Controls: Big B Button, Knob Push A Hint, START -->
    <div class="right-wing">
      <button class="round-btn-b-large" id="btn-b" type="button">B</button>
      <div class="knob-hint-badge" id="knob-hint">🔘 Knob Push = A</div>
      <button class="meta-pill-right" id="btn-start" type="button">START</button>
    </div>
  </div>

  <script>
    // GameBoyCore global configuration
    window.cout = function(msg) { console.log("[GB]", msg); };
    window.initNewCanvas = function() {};
    window.settings = [
      false, // audio
      false, // boot ROM
      false, // GB priority
      1,     // volume
      true,  // colorize GB
      false, // disallow typed arrays
      8,     // interval
      10, 20, false, false, false, false, false, [true, true, true, true]
    ];
  </script>
  <!-- Pure JavaScript Game Boy Engine -->
  <script src="emulator/gameboy.js"></script>

  <script>
    const canvas = document.getElementById('screen');
    const lblTitle = document.getElementById('lbl-title');
    const lblFps = document.getElementById('lbl-fps');
    const osd = document.getElementById('osd-msg');
    const knobBadge = document.getElementById('knob-hint');

    function showOsd(text) {
      osd.textContent = text;
      osd.className = 'osd visible';
      clearTimeout(window._osdTimer);
      window._osdTimer = setTimeout(() => { osd.className = 'osd'; }, 1800);
    }

    // Binary file loader
    function loadDiskFile(path) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', path);
        xhr.responseType = 'arraybuffer';
        xhr.onload = () => {
          if (xhr.status === 200 || xhr.status === 0) resolve(xhr.response);
          else reject(new Error(`Failed to load ${path}`));
        };
        xhr.onerror = () => reject(new Error(`Network error loading ${path}`));
        xhr.send();
      });
    }

    let gb = null;
    let gbLoop = null;
    let currentRomBuffer = null;

    // GameBoyCore Keypad Mapping:
    // 0: Right, 1: Left, 2: Up, 3: Down, 4: A, 5: B, 6: Select, 7: Start
    const KEY_INDEX = {
      right: 0,
      left: 1,
      up: 2,
      down: 3,
      a: 4,
      b: 5,
      select: 6,
      start: 7
    };

    const BTN_ELS = {
      b: document.getElementById('btn-b'),
      select: document.getElementById('btn-select'),
      start: document.getElementById('btn-start'),
      up: document.getElementById('btn-up'),
      down: document.getElementById('btn-down'),
      left: document.getElementById('btn-left'),
      right: document.getElementById('btn-right')
    };

    const PRESS_TIMERS = {};

    function updateInput(key, down) {
      const idx = KEY_INDEX[key];
      const el = BTN_ELS[key];

      if (key === 'a' && knobBadge) {
        if (down) knobBadge.classList.add('active');
        else setTimeout(() => knobBadge.classList.remove('active'), 140);
      }

      if (down) {
        if (el) el.classList.add('active');
        if (gb) gb.JoyPadEvent(idx, true);
      } else {
        // 140ms latch so game frame loop never misses a quick finger tap
        clearTimeout(PRESS_TIMERS[key]);
        PRESS_TIMERS[key] = setTimeout(() => {
          if (el) el.classList.remove('active');
          if (gb) gb.JoyPadEvent(idx, false);
        }, 140);
      }
    }

    // Touch and Pointer Control Binding
    function bindControl(el, key) {
      function press(e) {
        if (e) e.preventDefault();
        updateInput(key, true);
      }
      function release(e) {
        if (e) e.preventDefault();
        updateInput(key, false);
      }

      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);

      el.addEventListener('touchstart', press, { passive: false });
      el.addEventListener('touchend', release, { passive: false });
      el.addEventListener('touchcancel', release, { passive: false });
    }

    Object.keys(BTN_ELS).forEach(k => {
      if (BTN_ELS[k]) bindControl(BTN_ELS[k], k);
    });

    // Hardware Button Bindings on Car Thing:
    // Knob Push (Enter, MediaPlayPause, Space) -> Button A!
    // Physical Back Button (Escape, Backspace, BrowserBack, b, x, k) -> Button B!
    // Top Button 2: SELECT, Top Button 3: START
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') {
        e.preventDefault();
        updateInput('a', true);
      } else if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'b' || k === 'x' || k === 'k') {
        e.preventDefault();
        updateInput('b', true);
      } else if (k === '2') updateInput('select', true);
      else if (k === '3') updateInput('start', true);
      else if (k === 'ArrowUp' || k === 'w') updateInput('up', true);
      else if (k === 'ArrowDown' || k === 's') updateInput('down', true);
      else if (k === 'ArrowLeft' || k === 'a') updateInput('left', true);
      else if (k === 'ArrowRight' || k === 'd') updateInput('right', true);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key;
      if (k === 'Enter' || k === ' ' || k === 'MediaPlayPause') {
        e.preventDefault();
        updateInput('a', false);
      } else if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack' || k === 'b' || k === 'x' || k === 'k') {
        e.preventDefault();
        updateInput('b', false);
      } else if (k === '2') updateInput('select', false);
      else if (k === '3') updateInput('start', false);
      else if (k === 'ArrowUp' || k === 'w') updateInput('up', false);
      else if (k === 'ArrowDown' || k === 's') updateInput('down', false);
      else if (k === 'ArrowLeft' || k === 'a') updateInput('left', false);
      else if (k === 'ArrowRight' || k === 'd') updateInput('right', false);
    });

    // Fast Binary to String converter (chunked)
    function arrayBufferToBinaryString(buffer) {
      const uint8 = new Uint8Array(buffer);
      let str = "";
      const CHUNK = 8192;
      for (let i = 0; i < uint8.length; i += CHUNK) {
        str += String.fromCharCode.apply(null, uint8.subarray(i, i + CHUNK));
      }
      return str;
    }

    // Launch Game Boy game
    function launchGame(buffer, title) {
      if (gbLoop) {
        clearInterval(gbLoop);
        gbLoop = null;
      }
      gb = null;

      currentRomBuffer = buffer;
      lblTitle.textContent = title || "Game Boy";
      lblFps.textContent = "GB 60 FPS";

      canvas.width = 160;
      canvas.height = 144;

      try {
        const romStr = arrayBufferToBinaryString(buffer);
        gb = new GameBoyCore(canvas, romStr);
        gb.start();
        gb.stopEmulator &= 1;
        var dateObj = new Date();
        gb.firstIteration = dateObj.getTime();
        gb.iterations = 0;

        // Restore save state from localStorage if available
        let restoredSram = false;
        try {
          const sramKey = "gb_sram_" + (title || "game").replace(/[^a-zA-Z0-9]/g, "_");
          const saved = localStorage.getItem(sramKey);
          if (saved && gb.MBCRam) {
            const raw = JSON.parse(saved);
            if (Array.isArray(raw) && raw.length > 0) {
              for (let i = 0; i < Math.min(raw.length, gb.MBCRam.length); i++) {
                gb.MBCRam[i] = raw[i];
              }
              restoredSram = true;
            }
          }
        } catch (e) {
          console.error("Failed to restore save:", e);
        }

        // High-precision execution loop
        gbLoop = setInterval(() => {
          if (gb) {
            gb.stopEmulator |= 1;
            gb.run();
          }
        }, 10);

        showOsd(restoredSram ? `Loaded ${title} (Save Restored)` : `Playing ${title}!`);
      } catch (err) {
        showOsd("Error: " + err.message);
        console.error(err);
      }
    }

    // Save SRAM battery backup to localStorage
    function persistSram(notify = false) {
      if (!gb || !gb.cBATT || !gb.MBCRam || gb.MBCRam.length === 0) return;
      try {
        const data = gb.saveSRAMState();
        if (data && data.length > 0) {
          const title = lblTitle.textContent || "game";
          const sramKey = "gb_sram_" + title.replace(/[^a-zA-Z0-9]/g, "_");
          localStorage.setItem(sramKey, JSON.stringify(data));
          if (notify) showOsd("💾 Game progress saved!");
        }
      } catch(e) {
        console.error("Failed to save SRAM:", e);
      }
    }

    // Auto-save battery SRAM every 12 seconds & on exit
    setInterval(() => persistSram(false), 12000);
    window.addEventListener('beforeunload', () => persistSram(false));
    document.getElementById('btn-save').addEventListener('pointerdown', () => persistSram(true));

    async function loadRomByPath(path, title) {
      showOsd("Loading game...");
      try {
        const buf = await loadDiskFile(path);
        launchGame(buf, title);
      } catch (err) {
        showOsd("Error: " + err.message);
        console.error(err);
      }
    }

    // Carousel Navigation
    function setActivePill(id) {
      document.querySelectorAll('.rom-pill').forEach(p => p.classList.remove('active'));
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }

    document.getElementById('pill-homebrew').addEventListener('pointerdown', () => {
      setActivePill('pill-homebrew');
      loadRomByPath('roms/2048.gb', "2048 Game Boy");
    });

    document.getElementById('pill-advancetris').addEventListener('pointerdown', () => {
      setActivePill('pill-advancetris');
      loadRomByPath('roms/advancetris.gba', "Advancetris Homebrew");
    });

    document.getElementById('pill-anguna').addEventListener('pointerdown', () => {
      setActivePill('pill-anguna');
      loadRomByPath('roms/anguna.gba', "Anguna Homebrew");
    });


    // Custom ROM Picker (.gb, .gbc)
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-open-file').addEventListener('pointerdown', () => fileInput.click());
    document.getElementById('pill-custom').addEventListener('pointerdown', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setActivePill('pill-custom');
      showOsd(`Loading ${file.name}...`);
      const reader = new FileReader();
      reader.onload = () => {
        launchGame(reader.result, file.name);
      };
      reader.readAsArrayBuffer(file);
    });

    // Reset
    document.getElementById('btn-reset').addEventListener('pointerdown', () => {
      if (currentRomBuffer) {
        launchGame(currentRomBuffer, lblTitle.textContent);
        showOsd("Game Reset");
      }
    });

    // Back to Launcher Tools
    document.getElementById('btn-back').addEventListener('pointerdown', () => {
      persistSram(false);
      window.location.href = '../index.html#tools';
    });

    // Default boot: 2048 Game Boy Homebrew
    window.addEventListener('load', () => {
      setTimeout(() => {
        loadRomByPath('roms/2048.gb', "2048 Game Boy");
      }, 150);
    });

  </script>
</body>
</html>
